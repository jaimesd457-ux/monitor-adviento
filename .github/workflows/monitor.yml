name: Monitor calendario
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revisar:
      runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor.py
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
      - name: Guardar productos vistos
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add vistos.json || true
          git diff --cached --quiet || (git commit -m "actualiza vistos" && git push)
